type: FailureEnvelope
id: FailureEnvelope
version: v1
summary: >
  失败响应体，FailureEnvelope 是系统级失败协议，任何 usecase 的异常对外暴露必须映射为 FailureEnvelope，不得直接泄漏实现异常。

fields:
  - name: errorCode
    type: string
    required: true
    desc: 稳定错误码，用于程序判断与跨系统对齐

  - name: errorMessage
    type: string
    required: true
    desc: 面向开发者或用户的错误描述文本

  - name: failureSemantic
    type: FailureSemantic
    required: true
    ref: ./FailureSemantic.yaml
    desc: >
      失败的语义分类，用于统一表达“发生了什么类型的失败”，
      与具体技术异常或错误码解耦

  - name: retryable
    type: boolean
    required: true
    desc: >
      是否允许在相同幂等键/业务条件下进行重试；
      true 表示重试可能成功，false 表示重试无意义

  - name: retryAfterMs
    type: int
    required: false
    desc: >
      建议的重试等待时间（毫秒），通常用于限流或下游过载场景

  - name: traceId
    type: string
    required: false
    desc: >
      全链路追踪标识，用于日志、监控与跨服务排障

  - name: occurredAt
    type: string
    format: iso-8601
    required: true
    default: now()
    desc: >
      错误发生时间点（ISO-8601 格式），用于问题定位与审计

  - name: context
    type: map
    required: false
    desc: >
      附加上下文信息（键值对），仅用于调试与日志，不应被业务逻辑依赖