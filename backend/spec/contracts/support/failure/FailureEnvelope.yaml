type: FailureEnvelope
id: FailureEnvelope
version: v1
summary: >
  失败响应体，FailureEnvelope 是系统级失败协议，任何 usecase 的异常对外暴露必须映射为 FailureEnvelope，不得直接泄漏实现异常。

fields:

  - name: failureSemantic
    type: FailureSemantic
    required: true
    ref: ./FailureSemantic.yaml
    desc: >
      失败的语义分类，用于统一表达“发生了什么类型的失败”，
      与具体技术异常或错误码解耦
  
  - name: certainty
    type: FailureCertainty
    required: false
    ref: ./FailureCertainty.yaml
    desc: >
      结果确定性，用于表达副作用是否发生不可确认

  - name: traceId
    type: string
    required: false
    desc: >
      全链路追踪标识，用于日志、监控与跨服务排障

  - name: occurredAt
    type: string
    format: iso-8601
    required: true
    default: now()
    desc: >
      错误发生时间点（ISO-8601 格式），用于问题定位与审计
