type: usecase
id: TaskSplitUseCase                       # e.g. UpdateProfile
version: v1
owner: <shawn>                  # optional
status: draft                            # draft | active | deprecated
since: "2026-01-05"                      # optional (ISO date)

summary: >
  接收用户自然语言任务描述 + schema(config)，
  调用 LLM 生成结构化 JSON，
  并对输出做格式校验，最后返回“已校验通过”的结构化结果；
  否则按失败语义返回；

offer:
  input:
    - name: taskSplitRequest
      type: TaskSplitRequestDTO
      required: true
      desc: 任务拆分请求
      ref: ./dto/taskSplitRequestDTO.yaml

  output:
    success:
      type: TaskSplitResultDTO                # e.g. TaskSplitResultDTO[]
      desc: >
        任务拆分结果列表，每个元素为任务拆分结果的描述；
        success仅在LLM输出通过schema校验且语义完整时返回；任意校验失败均视为failure；
        结果结构由schema定义，usecase仅保证输出满足schema。
      ref: ./dto/taskSplitResultDTO.yaml
    failure:
      model: TaskSplitException
      desc: 任务拆分失败

  effects:
    - name: call_llm                     # e.g. update-profile
      kind: third_party_sdk                    # write_db | call_http | publish_event | send_email | ...
      desc: >
        调用LLM生成结构化JSON；
        可能发生超时，限流，不可达或返回非结构化结果。
    - name: write_idempotency_record
      kind: write_db
      desc: 写入幂等记录，用于防止重复请求

  idempotency:
    supported: true                     # true/false
    key:
      required: true
      name: idempotencyKey
      scope: user                     # e.g. user | tenant | global | (custom)
    semantics:
      duplicate_request: wait-and-return-same-result     
      concurrent_request: wait-and-return-same-result
    notes: >
      幂等语义仅在 (userId + idempotencyKey) 维度定义：
      若未提供 userId，则幂等语义退化为（callerProvidedId + idempotencyKey），其中 callerProvidedId 由调用方在请求中稳定提供（例如通过请求头 X-User-Id），用于在未登录场景下形成幂等域；
      并发同 key 时，阻塞等待首个请求完成，返回相同结果；
      不对同一用户不同 key 的并发请求提供额外冲突语义承诺

  consistency:
    level: strong                        # strong | eventual | unknown
    read_your_writes: true               # 调用方是否能立即读到变更
    completion:
      mode: sync                         # sync | accept-async


  retry:
    caller_may_retry: true
    safe_when:
      - same_idempotency_key                      
    notes: >
      契约使用相同 (userId + idempotencyKey) 重试是安全的；
      除上述条件外的重试行为，其结果不在本契约的保证范围内；
      具体的重试策略，不在契约范围内；
  # 7) 失败与异常（仅业务异常 / 对上层可见）
  #   注意：这里不出现 SDK 原始异常；下游技术异常应先在 adapter/support 归一化
  exceptions:
    model: TaskSplitException
    envelope:
      model: FailureEnvelope
      ref: ../common/FailureEnvelope.yaml
    desc: >
      对上层可见的失败统一使用 TaskSplitException 表达；
      其对外字段协议遵循 FailureEnvelope（见 ref）。
      具体“失败语义 -> 错误码/异常”的映射规则在 policy.error_mapping 中定义。
      FailureEnvelope中的traceId必须与本次请求的traceId一致；

  observability:
    guarantee: >
      无论成功或失败，只要进入usecase，均产生trace与metrics记录；
    trace:
      required: true
      fields:
        - traceId
        - userId
    metrics:
      - name: task_split_requests_total
        type: counter
        scope: usecase
        desc: >
          TaskSplitUseCase 的请求总次数，每次进入 usecase 入口时递增一次，包含成功与失败请求。

      - name: task_split_failures_total
        type: counter
        scope: usecase
        dimensions:
          - name: failureSemantic
            type: FailureSemantic
            ref: ../common/FailureSemantic.yaml
        desc: >
          TaskSplitUseCase 的失败请求次数，按 FailureSemantic 维度区分失败类型；仅当对上层返回失败结果时递增。
    logs:
      pii: prohibited
      redaction: required

assumption:
  # Assumption 只引用下游 Offer 的条款标识，不复制内容
  dependsOn:
    - offer: <PortOfferId>               # e.g. IdempotencyPort.offer
      version: v1
      clauses: [<ClauseId>, <ClauseId>]  # e.g. [I1, I3, I4]
      purpose: >
        <我依赖这些条款来保证什么语义>
    - offer: <PortOfferId>
      version: v1
      clauses: [<ClauseId>]
      purpose: >
        <...>

  # 对调用方的最低假设（可选，仅当不写会导致语义无法成立）
  caller_assumptions:
    - 调用方在同一幂等域内对相同业务操作使用相同的 idempotencyKey
    - 当未提供 userId 时，调用方应在重试/并发请求中稳定提供 callerProvidedId（例如 X-User-Id），否则幂等语义无法成立

policy:
  # policy 只写实现决策：如何在不改变 offer 承诺的前提下落地
  idempotency:
    strategy: none                       # none | request-level | step-level
    store: <IdempotencyPort>             # e.g. IdempotencyPort
    ttl_seconds: 86400
    notes: >
      <幂等表/缓存/透传下游幂等等决策细节>

  transaction:
    boundary: single-db                  # single-db | multi-resource
    notes: >
      <事务边界、是否 outbox、是否 saga 等>

  concurrency:
    strategy: optimistic-lock            # optimistic-lock | pessimistic-lock | none
    retry:
      enabled: false
      max_attempts: 0
      backoff_ms: 0

  error_mapping:
    # 仅允许引用：port 技术异常类型 / failure semantic（来自 support classifier）
    rules:
      - from: <FailureSemantic>          # e.g. UNKNOWN_RESULT | RETRYABLE | NON_RETRYABLE
        to: <BusinessExceptionOrResponse>
        note: <why>

  rollout:
    compatibility: compatible            # compatible | breaking
    migration_notes: >
      <若 breaking，写清楚迁移策略>

notes:
  - <anything else>