type: model
id: WaitResult
version: v1
summary: >
  wait_for_completion 的等待结果模型：完成返回完成态与负载，超时返回 WAIT_TIMEOUT 并明确结果不可确认。

fields:
  - name: kind
    type: enum
    allowed:
      - COMPLETED_SUCCESS
      - COMPLETED_FAILURE
      - WAIT_TIMEOUT
    desc: 等待结果分支；WAIT_TIMEOUT 表示在 waitTimeout 内未观测到完成

  - name: status
    type: enum
    allowed:
      - SUCCESS
      - FAILED
      - IN_PROGRESS
    desc: 幂等记录在返回时的状态；WAIT_TIMEOUT 时通常为 IN_PROGRESS

  - name: resultPayload
    type: string
    required: false
    desc: 已完成记录的结果负载（COMPLETED_* 时必须存在；WAIT_TIMEOUT 时不得要求存在）

  - name: certainty
    type: enum
    allowed:
      - CONFIRMED_NOT_EXECUTED
      - UNKNOWN
    desc: WAIT_TIMEOUT 时必须为 UNKNOWN，用于表达结果不可确认

  - name: traceId
    type: string
    required: false
    desc: 用于本地日志关联（若上下文可得则填充）

